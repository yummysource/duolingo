name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test offline contracts
        run: >-
          npx vitest run
          --exclude tests/integration/live.test.ts
          --exclude tests/integration/public-user.test.ts

      - name: Check live-test credentials
        id: live_credentials
        env:
          DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
        run: |
          if [ -n "$DUOLINGO_USERNAME" ] && [ -n "$DUOLINGO_JWT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live integration tests skipped: credentials unavailable"
          fi

      - name: Test live API contracts
        if: steps.live_credentials.outputs.enabled == 'true'
        run: >-
          npx vitest run
          tests/integration/live.test.ts
          tests/integration/public-user.test.ts
        env:
          DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
          DUOLINGO_TEST_USERNAME: ${{ secrets.DUOLINGO_TEST_USERNAME }}

      - name: Publish dry-run
        run: npm publish --dry-run --access public

name: Publish
run-name: Publish ${{ github.event.release.tag_name || inputs.tag || github.sha }}

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (for example, v1.0.0)
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ] && [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check npm version
        id: npm_version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm run lint

      - name: Format check
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm run format:check

      - name: Test
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm test

      - name: Build
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm run build

      - name: Publish
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
